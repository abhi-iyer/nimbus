[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus"
version = "0.1.0"
description = "Nimbus: N-expert Interpolating Manifold: Bezier over an Underlying Simplex."
requires-python = ">=3.9"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["nimbus*", "experiments*"]
